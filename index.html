<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Plaire Knowledge</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&display=swap">
<style>
:root{--bg:#f5f7f9;--side:#ffffff;--card:#ffffff;--card2:#eef3f8;--line:#e1e7ee;--ink:#17222b;--mute:#6a7b8c;--acc:#1f7ad1;--accd:#ffffff;--danger:#c62828;
--paper:#ffffff;--pink:#16191d;--pline:#e2e6ec;--pmute:#5d6672;--pacc:#1f4fd1;--psoft:#f2f5f9}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Pretendard Variable",Pretendard,system-ui,sans-serif;overflow-x:clip}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pri{background:var(--acc);border-color:var(--acc);color:var(--accd);font-weight:700}
.danger{color:var(--danger)}
.delbtn{background:#fdecea;border-color:#f5c2c0;color:var(--danger);font-weight:700}
.delbtn:hover{background:var(--danger);color:#fff}
input[type=text],input[type=search],input[type=url],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:42px;padding:0 12px;width:100%;font-size:15px}
textarea{padding:10px 12px;min-height:120px}
a{color:var(--acc)}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 6px 16px}
.logo b{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#5cc8f0,#4fd1b5);color:#0b1a24;font-size:14px}
.logo span{font-weight:700;line-height:1.2}.logo small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:none;min-height:42px;font-size:15px}
.nav.on{background:var(--card2);border-color:var(--line);box-shadow:inset 3px 0 0 var(--acc)}
.sechd{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:12px;padding:14px 6px 6px}
.sechd button{min-height:26px;width:26px;padding:0;border-radius:7px}
.area{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;min-height:32px;padding:0 8px;font-size:14px;border-radius:8px;text-align:left}
.area.on{background:var(--card2)}
.area i{width:8px;height:8px;border-radius:50%;flex:none}
.area span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.area em{font-style:normal;color:var(--mute);font-size:12px}
.me{margin-top:auto;padding:12px 6px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:13px}
.me img,.me .av{width:32px;height:32px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700}
.me div{flex:1}.me small{color:var(--mute);display:block}
.top{display:flex;gap:10px;align-items:center;padding:12px clamp(14px,3vw,28px);border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(245,247,249,.92);backdrop-filter:blur(8px);z-index:5}
.top .search{flex:1;position:relative}
.top .search input{padding-left:36px;background:var(--card)}
.top .search:before{content:"⌕";position:absolute;left:12px;top:50%;transform:translateY(-52%);color:var(--mute);font-size:18px}
.menu{display:none}
.page{padding:clamp(18px,3vw,32px) clamp(14px,3vw,28px) 80px;max-width:1240px}
.eyebrow{color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.06em}
h1{font-size:clamp(24px,3.2vw,32px);line-height:1.2;margin:4px 0 6px}
.sub{color:var(--mute);margin:0 0 22px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:6px 0 20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat small{color:var(--mute)}.stat b{display:block;font-size:28px;line-height:1.3}.stat span{color:var(--mute);font-size:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(16,40,60,.04)}
.panel h3{margin:0 0 4px;font-size:17px}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) 150px;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.badge{display:grid;place-items:center;width:52px;height:60px;border-radius:6px;font-size:11px;font-weight:800;color:#0b1a24}
.t-BOOK{background:#5cb8f0}.t-PAPER{background:#4fd1b5}.t-CLASS{background:#e8c06a}.t-CASE{background:#f08f7a}.t-MEMO{background:#b9a6f0}
.row h4{margin:0;font-size:15px}.row p{margin:2px 0 6px;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;background:none;min-height:24px;color:var(--ink)}
.chip i{width:6px;height:6px;border-radius:50%}
.prog{font-size:12px;color:var(--mute)}.prog div{height:6px;border-radius:9px;background:var(--line);margin-bottom:4px;overflow:hidden}.prog div i{display:block;height:100%;background:var(--acc)}
.cont{background:linear-gradient(160deg,#e4f1fc,#ffffff);border-radius:16px;border:1px solid var(--line);padding:20px}
.cont h2{margin:6px 0 6px;font-size:22px;line-height:1.25}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select{width:auto}
.listcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 18px;margin-bottom:10px}
.empty{padding:40px 20px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:14px}
.back{background:none;border:0;color:var(--mute);padding:0;min-height:30px}
.notegrid{display:grid;grid-template-columns:220px minmax(0,1fr) 280px;gap:16px;align-items:start}
.toc{position:sticky;top:76px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;max-height:calc(100vh - 96px);overflow-y:auto}
.toc h4{margin:0 6px 8px;font-size:13px;color:var(--mute);font-weight:600}
.toc .up{display:block;width:100%;text-align:left;border:0;background:none;min-height:30px;padding:0 6px;font-size:13px;color:var(--mute)}
.toc .addsub{width:100%;margin-top:8px;border-style:dashed;color:var(--acc);font-size:13px;min-height:36px}
.tr{display:flex;align-items:center;border-radius:7px;min-height:30px}
.tr:hover{background:var(--card2)}
.tr.on{background:#e3eefb}.tr.on .tn{color:var(--acc);font-weight:700}
.tw{flex:none;width:22px;min-height:26px;padding:0;border:0;background:none;color:var(--mute);font-size:11px}
.tw.none{visibility:hidden}
.tn{flex:1;text-align:left;border:0;background:none;min-height:30px;padding:0 4px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tadd{flex:none;width:24px;min-height:24px;padding:0;border:0;background:none;color:var(--mute);font-size:16px;opacity:.35;border-radius:6px}
.tr:hover .tadd{opacity:1}.tadd:hover{background:var(--line);color:var(--acc)}
.tr i.dot{width:8px;height:8px;border-radius:50%;flex:none;margin:0 2px 0 4px}
.tr[draggable=true]{cursor:grab}
.tr.dragging{opacity:.4}
.tr.dt-in{background:#d6e7fb;outline:2px solid var(--acc)}
.tr.dt-before{box-shadow:inset 0 2px 0 var(--acc)}
.tr.dt-after{box-shadow:inset 0 -2px 0 var(--acc)}
.tr em{font-style:normal;color:var(--mute);font-size:12px;padding:0 2px}
@media(hover:none){.tadd{opacity:.8}}
.head{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;gap:16px;align-items:center;margin-bottom:12px}
.head .badge{width:64px;height:76px}
.head .ti{flex:1}
.head input.title{font-size:22px;font-weight:700;background:none;border:0;padding:0;min-height:36px}
.head input.srcline{background:none;border:0;padding:0;min-height:26px;color:var(--mute);font-size:13px}
.head .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.crumb{font-size:13px;color:var(--mute);margin:4px 0 8px;display:flex;flex-wrap:wrap;gap:4px}
.crumb button{background:none;border:0;min-height:24px;padding:0 4px;color:var(--mute);font-size:13px}
.side h4{margin:0 0 10px;font-size:15px}
.side .panel{margin-bottom:12px;padding:16px}
.kv{display:grid;grid-template-columns:52px minmax(0,1fr);gap:6px 10px;align-items:center;font-size:13px;color:var(--mute)}
.kv input,.kv select{min-height:34px;font-size:13px;padding:0 8px}
.drop{border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--mute);font-size:13px;cursor:pointer}
.drop.over{border-color:var(--acc);color:var(--acc)}
.att{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.att a{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att small{color:var(--mute)}
.att button{min-height:28px;padding:0 8px;font-size:12px}
input[type=range]{width:100%;accent-color:var(--acc)}
.subs .chip{cursor:pointer;margin:0 6px 6px 0}
/* 편집기 */
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:5px;position:sticky;top:66px;z-index:4;background:var(--card);padding:9px;border:1px solid var(--line);border-radius:12px 12px 0 0}
.tools button,.tools select,.colr{min-height:32px;min-width:32px;padding:0 8px;font-size:13px;border-radius:7px;border:1px solid var(--line);background:var(--card2);color:var(--ink)}
.tools select{width:auto;max-width:74px;padding:0 2px}
.tools .brk{flex-basis:100%;height:0}
.ttools{display:none;flex-basis:100%;flex-wrap:wrap;align-items:center;gap:5px;padding:8px;margin-top:4px;border-radius:8px;background:#eef5fd;border:1px solid #cfe1f7;font-size:13px}
.ttools.show{display:flex}.ttools b{margin-right:4px;color:var(--acc)}
.tools .sep{width:1px;align-self:stretch;background:var(--line);margin:2px}
.colr{display:inline-flex;align-items:center;gap:5px;position:relative;cursor:pointer}
.colr input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.colr i{width:14px;height:12px;border:1px solid rgba(0,0,0,.25);border-radius:2px}
.tools .tb-blue{background:#e3eefb;color:#16191d}.tools .tb-green{background:#e3f4e8;color:#16191d}.tools .tb-warn{background:#fff6e0;border-color:#f0b44c;color:#16191d}
.paper{font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;border:1px solid var(--line);border-top:0;background:var(--paper);color:var(--pink);border-radius:0 0 14px 14px;padding:clamp(18px,4vw,44px);min-height:65vh}
.editor{outline:none;min-height:60vh;cursor:text}
.paper{cursor:default}
.editor:empty:before{content:"공부한 내용을 자유롭게 쓰세요. #태그 를 쓰면 나중에 모아 볼 수 있습니다.";color:var(--pmute)}
.editor img{cursor:pointer}.editor img.sel{outline:3px solid var(--pacc)}
.content{overflow-wrap:anywhere;font-size:16px;line-height:1.75}
.content h2{font-size:24px;margin:28px 0 14px;padding-bottom:8px;border-bottom:1.5px solid var(--pink);line-height:1.3}
.content h3{font-size:19px;margin:22px 0 8px}
.content p{margin:0 0 12px}
.content ul,.content ol{margin:0 0 12px;padding-left:24px}
@counter-style kn-paren{system:extends decimal;suffix:") "}
@counter-style kn-both{system:extends decimal;prefix:"(";suffix:") "}
@counter-style kn-circle{system:fixed;symbols:"①" "②" "③" "④" "⑤" "⑥" "⑦" "⑧" "⑨" "⑩" "⑪" "⑫" "⑬" "⑭" "⑮" "⑯" "⑰" "⑱" "⑲" "⑳";suffix:" ";fallback:decimal}
.content ol{list-style-type:decimal}
.content ol ol{list-style-type:kn-paren;margin-bottom:0}
.content ol ol ol{list-style-type:kn-both}
.content ol ol ol ol{list-style-type:kn-circle}
.content ul ul{margin-bottom:0}
.editor.colrs,.editor.colrs td,.editor.colrs th{cursor:col-resize}
.content mark{background:#fff1a8;color:inherit}
.content img{max-width:100%;height:auto;border-radius:8px;display:block;margin:12px 0}
.content img.img-s{width:40%}.content img.img-m{width:70%}.content img.img-l{width:100%}
.content hr{border:0;border-top:1px solid var(--pline);margin:24px 0}
.content blockquote{margin:0 0 12px;padding:10px 16px;border-left:3px solid var(--pacc);background:var(--psoft)}
.content details{border:1px solid var(--pline);border-radius:10px;padding:0 16px;margin:0 0 12px}
.content summary{cursor:pointer;font-weight:600;padding:10px 0}
.content .box-blue,.content .box-green,.content .box-warn{border-radius:10px;padding:14px 18px;margin:0 0 14px}
.content .box-blue{background:#e3eefb}.content .box-green{background:#e3f4e8}.content .box-warn{background:#fff6e0;border:1px solid #f0b44c}
.content [class^=box-]>:last-child{margin-bottom:0}
.content ul.check{list-style:none;padding-left:4px}
.content ul.check>li{position:relative;padding-left:30px;margin:0 0 8px}
.content ul.check>li:before{content:"";position:absolute;left:0;top:.3em;width:17px;height:17px;border:1.5px solid var(--pmute);border-radius:4px}
.content ul.check>li.done:before{background:var(--pacc);border-color:var(--pacc)}
.content ul.check>li.done:after{content:"✓";position:absolute;left:3px;top:0;color:#fff;font-size:14px;font-weight:700}
.content ul.check>li.done{color:var(--pmute);text-decoration:line-through}
.content ol.steps{list-style:none;padding-left:0;counter-reset:st}
.content ol.steps>li{counter-increment:st;position:relative;padding-left:38px;margin:0 0 10px}
.content ol.steps>li:before{content:counter(st);position:absolute;left:0;top:.1em;width:26px;height:26px;border-radius:50%;background:var(--pacc);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
.content .ref{color:var(--pmute);font-size:.88em}
.content table{border-collapse:collapse;width:100%;margin:0 0 14px;font-size:15px}
.content th,.content td{border:1px solid var(--pline);padding:8px 10px;text-align:left;vertical-align:top}
.content th{background:var(--psoft)}
.content .tag{color:var(--pacc);background:#e8eefc;border-radius:6px;padding:0 5px;font-weight:600;cursor:pointer}
.savebar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;color:var(--mute);font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}
.modal.show{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:440px;width:100%;display:grid;gap:12px}
.modal .box p{margin:0}.modal .r{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;z-index:40;display:none}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.center .panel{max-width:560px;width:100%}
.veil{display:none}
@media(max-width:1300px){.notegrid{grid-template-columns:200px minmax(0,1fr)}.notegrid>.side{grid-column:1/-1}}
@media(max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:860px){.notegrid{grid-template-columns:minmax(0,1fr)}.toc{position:static;max-height:none}}
@media(max-width:860px){
  .shell{display:block}
  aside{position:fixed;inset:0 auto 0 0;width:min(84vw,290px);z-index:20;transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none}
  .veil.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:19}
  .menu{display:inline-block}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row{grid-template-columns:44px minmax(0,1fr)}.row .prog{grid-column:2}
  .badge{width:44px;height:52px}
  .head{flex-wrap:wrap}.head .acts{width:100%;justify-content:flex-start}
  .tools{top:62px}
  .top .hide-m{display:none}
}
</style>
</head>
<body>
<div id="root"><div class="center">불러오는 중…</div></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="edfile" accept="image/*" multiple hidden>
<input type="file" id="attfile" multiple hidden>
<input type="file" id="impfile" accept=".json,application/json" hidden>
<script type="module">
/* =========================================================
   Firebase 설정: Firebase 콘솔 > 프로젝트 설정 > 내 앱 > SDK 설정의
   firebaseConfig 값을 아래 null 자리에 붙여넣으면 됩니다.
   (비워두면 처음 열 때 화면에서 붙여넣을 수 있습니다.)
   ========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBFnD9IH3lBEcGMn9K0tuSfw72wndMKw70",
  authDomain: "plaire-knowledge.firebaseapp.com",
  projectId: "plaire-knowledge",
  storageBucket: "plaire-knowledge.firebasestorage.app",
  messagingSenderId: "1013942711814",
  appId: "1:1013942711814:web:62f078fc70aa11368e3587"
};

import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,doc,setDoc,updateDoc,deleteDoc,onSnapshot,writeBatch} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {getStorage,ref as sref,uploadBytes,getDownloadURL,deleteObject} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';

const $=id=>document.getElementById(id);
const root=$('root'),modal=$('modal'),mbox=$('mbox');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TAG_RE=/#([0-9A-Za-z가-힣ㄱ-ㅎ_\-]+)/g;
const TYPES={BOOK:'책',PAPER:'논문',CLASS:'강의',CASE:'증례',MEMO:'메모'};
const DEFAULT_AREAS=[['보존·접착','#5cb8f0'],['근관치료','#a48cf0'],['치주','#4fd1b5'],['보철','#e8c06a'],['임플란트','#f08f7a'],['구강외과','#f07aa8'],['교정','#7ad1f0'],['소아','#9be07a'],['수면·진정','#4fc1d1'],['진단·영상','#8f9cf0'],['경영·교육','#c0c7cf'],['미분류','#6b7f8c']];
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const toast=t=>{const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)};
const ago=ms=>{if(!ms)return'';const m=(Date.now()-ms)/60000;return m<1?'방금':m<60?Math.floor(m)+'분 전':m<1440?Math.floor(m/60)+'시간 전':m<43200?Math.floor(m/1440)+'일 전':new Date(ms).toLocaleDateString('ko-KR')};
const fsize=b=>!b?'':b<1048576?Math.round(b/1024)+'KB':(b/1048576).toFixed(1)+'MB';

/* ---------- 설정 읽기 ---------- */
function parseCfg(t){
  if(!t)return null;const o={};
  for(const m of String(t).matchAll(/(\w+)\s*:\s*["']([^"']+)["']/g))o[m[1]]=m[2];
  return o.apiKey&&o.projectId?o:null;
}

const OK=new Set(['P','BR','H2','H3','B','STRONG','I','EM','U','S','STRIKE','DEL','SPAN','MARK','UL','OL','LI','DETAILS','SUMMARY','IMG','HR','BLOCKQUOTE','DIV','A','TABLE','THEAD','TBODY','TR','TH','TD']);
const DROP=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','LINK','META','SVG','TEMPLATE','FORM','INPUT','BUTTON','TEXTAREA','SELECT']);
const CLS=new Set(['box-blue','box-green','box-warn','check','done','steps','ref','img-s','img-m','img-l']);
const FONTS={'Pretendard Variable':'기본','Nanum Myeongjo':'명조','Nanum Pen Script':'손글씨'};
const COLOR_RE=/^(#[0-9a-f]{3,8}|rgba?\([\d\s,.%]+\))$/i,SIZE_RE=/^(\d+(\.\d+)?(px|em|rem)|x-small|small|medium|large|x-large|xx-large|xxx-large)$/;
function clean(html,strip){
  const d=new DOMParser().parseFromString('<div id="r">'+(html||'')+'</div>','text/html');
  const rt=d.getElementById('r');
  (function walk(n){
    [...n.childNodes].forEach(c=>{
      if(c.nodeType===8){c.remove();return}
      if(c.nodeType!==1)return;
      let t=c.tagName.toUpperCase();
      if(DROP.has(t)){c.remove();return}
      walk(c);
      if(/^H[1456]$/.test(t)){const h=d.createElement(t==='H1'?'h2':'h3');while(c.firstChild)h.appendChild(c.firstChild);c.replaceWith(h);return}
      if(t==='FONT'){const sp=d.createElement('span');const col=c.getAttribute('color'),face=c.getAttribute('face'),sz=c.getAttribute('size');
        if(col)sp.style.color=col;if(face)sp.style.fontFamily=face;if(sz)sp.style.fontSize=['x-small','x-small','small','medium','large','x-large','xx-large','xxx-large'][+sz]||'';
        while(c.firstChild)sp.appendChild(c.firstChild);c.replaceWith(sp);c=sp;t='SPAN'}
      if(!OK.has(t)){c.replaceWith(...c.childNodes);return}
      const s=c.style,keep=[];
      if(!strip&&s){
        if(s.color&&COLOR_RE.test(s.color))keep.push('color:'+s.color);
        if(s.backgroundColor&&COLOR_RE.test(s.backgroundColor)&&s.backgroundColor!=='rgba(0, 0, 0, 0)')keep.push('background-color:'+s.backgroundColor);
        if(s.fontSize&&SIZE_RE.test(s.fontSize))keep.push('font-size:'+s.fontSize);
        if(s.fontFamily){const f=Object.keys(FONTS).find(k=>s.fontFamily.includes(k));if(f)keep.push("font-family:'"+f+"'")}
        if(/^(left|center|right)$/.test(s.textAlign))keep.push('text-align:'+s.textAlign);
        if(/^\d{1,3}(px|em)$/.test(s.marginLeft)&&parseFloat(s.marginLeft)>0)keep.push('margin-left:'+s.marginLeft);
        if((t==='TD'||t==='TH')&&/^\d{2,4}px$/.test(s.width))keep.push('width:'+s.width);
      }
      const cls=strip?'':(c.getAttribute('class')||'').split(/\s+/).filter(x=>CLS.has(x)).join(' ');
      for(const a of [...c.attributes]){
        const ok=(t==='IMG'&&a.name==='src'&&/^https:\/\//.test(a.value))||(t==='A'&&a.name==='href'&&/^https?:\/\//.test(a.value))||((t==='TD'||t==='TH')&&(a.name==='colspan'||a.name==='rowspan')&&/^([2-9]|[1-4]\d)$/.test(a.value));
        if(!ok)c.removeAttribute(a.name);
      }
      if(keep.length)c.setAttribute('style',keep.join(';'));
      if(cls)c.setAttribute('class',cls);
      if(t==='SPAN'&&!c.attributes.length){c.replaceWith(...c.childNodes);return}
      if(t==='IMG'&&!c.getAttribute('src'))c.remove();
      if(t==='A'){c.setAttribute('target','_blank');c.setAttribute('rel','noopener')}
    });
  })(rt);
  return rt.innerHTML;
}
const plain=html=>{const d=new DOMParser().parseFromString('<div>'+clean(html).replace(/<\/(p|div|h2|h3|li|td|th|summary|blockquote|tr|details)>|<br\s*\/?>/gi,' $&')+'</div>','text/html');return d.body.textContent.replace(/\s+/g,' ').trim()};
const tagsOf=(...parts)=>[...new Set(parts.join(' ').match(TAG_RE)||[])].map(x=>x.slice(1));
function linkTags(el){
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const ns=[];
  while(w.nextNode()){if(!w.currentNode.parentElement.closest('a'))ns.push(w.currentNode)}
  ns.forEach(n=>{const s=n.nodeValue;if(!s.includes('#'))return;TAG_RE.lastIndex=0;if(!TAG_RE.test(s))return;
    const f=document.createDocumentFragment();let last=0,m;TAG_RE.lastIndex=0;
    while(m=TAG_RE.exec(s)){f.append(s.slice(last,m.index));const sp=document.createElement('span');sp.className='tag';sp.dataset.tag=m[1];sp.textContent='#'+m[1];f.append(sp);last=m.index+m[0].length}
    f.append(s.slice(last));n.replaceWith(f)});
}

}
const topsOf=aid=>all().filter(n=>!n.parent&&(n.area||'')===aid).sort((a,b)=>ord(a)-ord(b));
const dragAttr=id=>(editing&&editing.isNew&&editing.id===id)?'':`draggable="true" data-drag="${esc(id)}" data-drop="${esc(id)}"`;
let dragId=null,dragOpenT=null;
document.addEventListener('dragstart',e=>{const r=e.target.closest&&e.target.closest('[data-drag]');if(!r)return;dragId=r.dataset.drag;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}r.classList.add('dragging')});
document.addEventListener('dragend',()=>{dragId=null;clearMarks()});
function clearMarks(){document.querySelectorAll('.dt-before,.dt-after,.dt-in,.dragging').forEach(x=>x.classList.remove('dt-before','dt-after','dt-in','dragging'))}
function dropPos(row,e){if(row.dataset.droparea!==undefined)return'in';const r=row.getBoundingClientRect(),y=(e.clientY-r.top)/r.height;return y<.28?'before':y>.72?'after':'in'}
function canDrop(target,src=dragId){if(!src||target===src)return false;return !desc(src).includes(target)}
document.addEventListener('dragover',e=>{
  if(!dragId)return;const row=e.target.closest&&e.target.closest('[data-drop],[data-droparea]');if(!row)return;
  const tid=row.dataset.drop;if(tid!==undefined&&!canDrop(tid))return;
  e.preventDefault();e.dataTransfer.dropEffect='move';
  const p=dropPos(row,e);if(row.classList.contains('dt-'+p))return;clearMarks();row.classList.add('dt-'+p);

document.addEventListener('drop',async e=>{
  if(!dragId)return;const row=e.target.closest&&e.target.closest('[data-drop],[data-droparea]');if(!row){clearMarks();return}
  e.preventDefault();const id=dragId,p=dropPos(row,e);dragId=null;clearMarks();clearTimeout(dragOpenT);

  else{const t=notes[row.dataset.drop];if(!t||!canDrop(t.id,id))return;
    if(p==='in'){parent=t.id;area=t.area||'';sibs=kids(t.id).filter(x=>x.id!==id);idx=sibs.length}
    else{parent=t.parent||'';area=t.area||'';sibs=(parent?kids(parent):topsOf(area)).filter(x=>x.id!==id);idx=sibs.findIndex(x=>x.id===t.id)+(p==='after'?1:0)}}

async function shrink(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type))return file;
  try{const bmp=await createImageBitmap(file);const max=2000,sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    if(sc===1&&file.size<1.5e6)return file;
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));return b&&b.size<file.size?new File([b],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):file}catch(e){return file}
}
async function upload(file,noteId){
  const f=await shrink(file);
  const path='users/'+user.uid+'/files/'+noteId+'/'+Date.now()+'_'+f.name.replace(/[^\w.\-가-힣]/g,'_');
  const r=sref(st,path);await uploadBytes(r,f,{contentType:f.type||'application/octet-stream'});
  return {name:f.name,url:await getDownloadURL(r),path,size:f.size,type:f.type,kind:'file',at:Date.now()};
}
function storageFail(e){
  console.error(e);
  const msg=/402|403|billing|unauthorized|bucket|no default/i.test((e.code||'')+(e.message||''))?'파일 저장소(Firebase Storage)가 아직 켜져 있지 않거나 권한이 없습니다. 안내에 따라 Storage를 켜 주세요. 그동안은 구글 드라이브 · NAS 링크로 연결하실 수 있습니다.':'업로드하지 못했습니다: '+(e.code||e.message);
  info(msg);
}
async function addFiles(fs){
  if(!fs.length)return;const n=notes[editing.id];toast('올리는 중… '+fs.length+'개');
  for(const f of fs){
    if(f.size>50*1048576){info(f.name+'은(는) 50MB가 넘습니다. 큰 파일은 구글 드라이브나 NAS에 두고 링크로 연결하세요.');continue}
    try{const a=await upload(f,n.id);n.files=[...(n.files||[]),a];await persistFiles(n);drawAtts()}catch(e){storageFail(e);break}
  }
}

function tModel(table){

  rows.forEach((tr,r)=>{let c=0;[...tr.cells].forEach(td=>{occ[r]=occ[r]||[];while(occ[r][c])c++;
    const rs=Math.max(1,td.rowSpan||1),cs=Math.max(1,td.colSpan||1);const a={r,c,rs,cs,html:td.innerHTML,th:td.tagName==='TH',el:td,w:td.style.width};cells.push(a);
    for(let i=0;i<rs;i++)for(let j=0;j<cs;j++){occ[r+i]=occ[r+i]||[];occ[r+i][c+j]=a}c+=cs})});
  const R=Math.max(rows.length,occ.length),C=Math.max(0,...occ.map(x=>x?x.length:0));
  return {cells,R,C};
}
function tFill(m){

  m.cells.forEach(a=>{a.rs=Math.min(a.rs,m.R-a.r);a.cs=Math.min(a.cs,m.C-a.c);for(let i=0;i<a.rs;i++)for(let j=0;j<a.cs;j++)occ[a.r+i][a.c+j]=a});
  for(let r=0;r<m.R;r++)for(let c=0;c<m.C;c++)if(!occ[r][c]){const a={r,c,rs:1,cs:1,html:'<br>',th:false};m.cells.push(a);occ[r][c]=a}
}

    m.cells.filter(a=>a.r===r).sort((x,y)=>x.c-y.c).forEach(a=>{const td=document.createElement(a.th?'th':'td');td.innerHTML=a.html||'<br>';if(a.w&&a.cs===1)td.style.width=a.w;if(a.rs>1)td.rowSpan=a.rs;if(a.cs>1)td.colSpan=a.cs;tr.append(td);if(a===focus)target=td});
    tb.append(tr)}

쓸 수 있는 형식:
- <h2>큰 제목</h2>, <h3>소제목</h3>, <p>문단</p>, <b>굵게</b>, <mark>형광펜</mark>
- 목록 <ul><li>, 번호 <ol><li>, 체크리스트 <ul class="check"><li>, 단계 <ol class="steps"><li>
- 상자: <div class="box-blue">핵심 요약</div>, <div class="box-green">임상 팁·적용</div>, <div class="box-warn"><p><b>⚠️ 확인 필요</b></p>…</div>
- 접는 글: <details><summary>제목</summary>자세한 이론·수치</details>
- 출처 표시: <span class="ref">(저자, 연도)</span>
- 표: <table><tr><th>…</th></tr><tr><td>…</td></tr></table>
권장 구성: 맨 위 box-blue에 한 줄 결론 → h2로 큰 흐름 → 자세한 이론·수치는 details로 접기 → 임상 적용은 box-green → 불확실한 부분은 box-warn.
다른 태그나 style 속성은 쓰지 말고, 결과는 HTML만 \`\`\`html 코드블록 하나로 답해 줘.

function toMd(html){
  const d=new DOMParser().parseFromString('<div id="r">'+clean(html)+'</div>','text/html').getElementById('r');
  const walk=n=>[...n.childNodes].map(c=>{
    if(c.nodeType===3)return c.nodeValue.replace(/\s+/g,' ');if(c.nodeType!==1)return'';
    const t=c.tagName,inner=()=>walk(c).trim();
    if(t==='H2')return'\n\n### '+inner()+'\n';if(t==='H3')return'\n\n#### '+inner()+'\n';
    if(t==='P'||t==='DIV'||t==='BLOCKQUOTE')return'\n'+inner()+'\n';
    if(t==='LI')return'\n- '+inner();if(t==='UL'||t==='OL')return walk(c)+'\n';
    if(t==='B'||t==='STRONG')return'**'+inner()+'**';if(t==='SUMMARY')return'\n**'+inner()+'**\n';
    if(t==='BR')return'\n';if(t==='IMG')return'[사진]';if(t==='A')return inner()+' ('+c.getAttribute('href')+')';
    if(t==='TR')return'\n| '+[...c.children].map(x=>walk(x).trim()).join(' | ')+' |';
    return walk(c)}).join('');
  return walk(d).replace(/\n{3,}/g,'\n\n').trim();
}
function mdExport(){
  const scope=$('mdscope').value;let list=all();
  if(scope.startsWith('a:'))list=list.filter(n=>(n.area||'')===scope.slice(2));
  if(scope.startsWith('t:'))list=list.filter(n=>(n.tags||[]).includes(scope.slice(2)));
  if(!list.length)return info('내보낼 노트가 없습니다.');
  const sorted=[];const seen=new Set(list.map(n=>n.id));
  const visit=n=>{if(seen.has(n.id))sorted.push(n);kids(n.id).forEach(visit)};
  areas.map(a=>a.id).concat(['']).forEach(aid=>topsOf(aid).forEach(visit));
  const md='# 임상 공부 노트 ('+$('mdscope').selectedOptions[0].text+')\n\n'+sorted.map(n=>{
    const a=areaOf(n.area);const src=[n.author,n.range,n.year].filter(Boolean).join(' · ');
    return '## '+pathOf(n.id).map(x=>x.title).join(' › ')+'\n'+[a?'- 진료 영역: '+a.name:'',src?'- 출처: '+src:'',n.topic?'- 요약: '+n.topic:'',(n.tags||[]).length?'- 태그: '+n.tags.map(t=>'#'+t).join(' '):''].filter(Boolean).join('\n')+'\n\n'+toMd(n.html);
  }).join('\n\n---\n\n');
  const b=new Blob([md],{type:'text/markdown'});const el=document.createElement('a');
  el.download='임상공부노트-'+$('mdscope').selectedOptions[0].text.replace(/[^\w가-힣·#-]/g,'')+'.md';el.href=URL.createObjectURL(b);el.click();setTimeout(()=>URL.revokeObjectURL(el.href),5000);
}

  <div class="r">${a?'<button class="danger" id="ad">삭제</button>':''}<button id="mn">취소</button><button class="pri" id="my">저장</button></div>`;
  modal.classList.add('show');$('mn').onclick=hide;$('an').focus();
  $('my').onclick=async()=>{const nm=$('an').value.trim();if(!nm)return $('an').focus();
    if(a){a.name=nm;a.color=$('ac').value}else areas.push({id:newId(),name:nm,color:$('ac').value});hide();
    try{await saveAreas();render()}catch(e){info('저장하지 못했습니다.')}};
  if(a)$('ad').onclick=()=>{const c=all().filter(n=>n.area===a.id).length;hide();
    ask(c?`「${a.name}」 영역의 노트 ${c}개는 지워지지 않고 '미지정'이 됩니다. 영역을 삭제할까요?`:`「${a.name}」 영역을 삭제할까요?`,'삭제',async()=>{areas=areas.filter(x=>x.id!==a.id);try{await saveAreas();if(filt.area===a.id)filt.area='';render()}catch(e){info('삭제하지 못했습니다.')}})};
}
function backup(){
  const data={app:'plaire-knowledge',version:1,exported:new Date().toISOString(),areas,notes:all()};
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');

  a.href=URL.createObjectURL(b);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
